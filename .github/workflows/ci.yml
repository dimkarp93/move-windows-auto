name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: test (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13']
    steps:
      - uses: actions/checkout@v4
      - name: Install gjs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gjs unzip ca-certificates
      - name: Versions
        run: gjs --version
      - name: Run tests
        run: bash tests/all.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src tests tools

  package:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/build.sh --pack
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: dist/*.shell-extension.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-zips
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.shell-extension.zip'
